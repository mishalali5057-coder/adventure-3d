<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>جزيرة المغامرة 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86c9e8;font-family:system-ui,Arial;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:#fff;text-shadow:0 2px 4px #123;font-weight:700}
.panel{background:#102b43bb;border:1px solid #ffffff55;border-radius:14px;padding:8px 12px;font-size:13px}
#mission{position:fixed;top:58px;right:10px;max-width:230px;color:white;background:#102b43cc;border-radius:12px;padding:9px 12px;font-size:13px;pointer-events:none}
#controls{position:fixed;inset:auto 0 14px;display:flex;align-items:end;justify-content:space-between;padding:0 16px;pointer-events:none}
#stick{width:132px;height:132px;border-radius:50%;background:#102b4355;border:2px solid #ffffff88;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#fff9;border:2px solid white;left:37px;top:37px}
#buttons{display:grid;grid-template-columns:repeat(2,66px);gap:8px;pointer-events:auto}
button{border:1px solid #ffffff99;background:#102b43dd;color:white;border-radius:15px;min-height:55px;font-weight:700;font-size:12px;touch-action:none}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:#102b43e8;color:white;padding:12px 18px;border-radius:14px;display:none;text-align:center;max-width:85%;font-weight:700}
#help{position:fixed;bottom:158px;left:10px;color:white;background:#102b4388;padding:7px 10px;border-radius:10px;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="panel">💎 البلورات: <span id="count">0</span>/12</div><div class="panel">🏝️ جزيرة المغامرة</div></div>
<div id="mission">🎯 المهمة: اجمع البلورات الـ12 ثم زر المخيم.</div>
<div id="help">اسحب العصا للحركة • اقفز • اقترب من السيارة واضغط ركوب</div>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="buttons">
  <button id="jump">⬆️ قفز</button><button id="ride">🚗 ركوب</button>
  <button id="cam">📷 تدوير</button><button id="map">🧭 المهمة</button>
 </div>
</div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8bd0ef); scene.fog=new THREE.Fog(0x8bd0ef,65,190);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.6)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x59734b,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-35,55,25); sun.castShadow=true; scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
const grass=mat(0x65a84f), sand=mat(0xe8d49a), wood=mat(0x79502e), leaf=mat(0x287b45), rock=mat(0x777d80), houseMat=mat(0xe6b66d), roofMat=mat(0x9a4937), roadMat=mat(0x62696d);
const ground=new THREE.Mesh(new THREE.CircleGeometry(95,64),grass); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const beach=new THREE.Mesh(new THREE.RingGeometry(83,96,64),sand); beach.rotation.x=-Math.PI/2; beach.position.y=.03; scene.add(beach);
const sea=new THREE.Mesh(new THREE.CircleGeometry(180,64),new THREE.MeshStandardMaterial({color:0x278dbb,roughness:.45})); sea.rotation.x=-Math.PI/2; sea.position.y=-.55; scene.add(sea);
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function tree(x,z,s=1){let t=new THREE.Group();let a=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.32*s,2*s,7),wood);a.position.y=s;a.castShadow=true;t.add(a);let b=new THREE.Mesh(new THREE.ConeGeometry(1.25*s,2.8*s,7),leaf);b.position.y=2.8*s;b.castShadow=true;t.add(b);t.position.set(x,0,z);scene.add(t)}
function house(x,z){box(7,4,6,houseMat,x,2,z);let r=new THREE.Mesh(new THREE.ConeGeometry(5.2,3,4),roofMat);r.position.set(x,5.4,z);r.rotation.y=Math.PI/4;r.castShadow=true;scene.add(r);box(1.25,2.2,.18,wood,x,1.1,z-3.08);box(1.3,1.2,.2,mat(0x8bd6e8),x-2,2.5,z-3.1)}
// طريق ومخيم
box(13,.12,2,roadMat,0,.08,0); box(2,.13,30,roadMat,0,.09,12);
house(-12,-10);house(13,-18);house(22,8);house(-25,18);
for(let i=0;i<48;i++){let ang=i*2.399,r=23+(i%7)*8,x=Math.cos(ang)*r,z=Math.sin(ang)*r;if(Math.hypot(x,z)<79)tree(x,z,.7+(i%4)*.12)}
for(let i=0;i<18;i++){let x=(Math.random()-.5)*140,z=(Math.random()-.5)*140;if(Math.hypot(x,z)<80) {let b=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+Math.random()*1.2),rock);b.position.set(x,.6,z);b.castShadow=true;scene.add(b)}}
// لاعب
const player=new THREE.Group();scene.add(player);
let body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,4,8),mat(0x2466c2));body.position.y=1.15;body.castShadow=true;player.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),mat(0xf0c49a));head.position.y=2;player.add(head);
let movingCar=false,car;
const carBody=mat(0xd94b35),glass=mat(0x9bd8e8),tire=mat(0x222222);
car=new THREE.Group(); // create local car parts
function carPart(g,geo,m,x,y,z){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}
car.clear();carPart(car,new THREE.BoxGeometry(3.4,.8,5),carBody,0,.8,0);carPart(car,new THREE.BoxGeometry(2.4,1.1,2.5),glass,0,1.65,-.2);
for(let x of [-1.65,1.65])for(let z of [-1.6,1.6]){let w=carPart(car,new THREE.CylinderGeometry(.48,.48,.35,12),tire,x,.48,z);w.rotation.z=Math.PI/2}
car.position.set(5,0,4);scene.add(car);
// بلورات
const crystals=[];const crystalMat=new THREE.MeshStandardMaterial({color:0x47f2ff,emissive:0x087c9b,metalness:.25,roughness:.25});
for(let i=0;i<12;i++){let a=i*2.4,r=28+(i%3)*12;let c=new THREE.Mesh(new THREE.OctahedronGeometry(.85),crystalMat);c.position.set(Math.cos(a)*r,1.2,Math.sin(a)*r);c.castShadow=true;scene.add(c);crystals.push(c)}
// شخصيات ودّية وعلامات
const npcMat=mat(0xe8a33b);
for(let p of [[-18,4],[18,-28],[32,18]]){let n=new THREE.Group();let q=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,4,8),npcMat);q.position.y=1;n.add(q);n.position.set(p[0],0,p[1]);scene.add(n)}
const camp= new THREE.Group();let fire=new THREE.Mesh(new THREE.ConeGeometry(1,2,6),mat(0xff8a24));fire.position.y=1;camp.add(fire);camp.position.set(0,0,-34);scene.add(camp);
let collected=0,joy={x:0,y:0},velY=0,camTurn=0;const toast=document.querySelector('#toast');
function say(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2100)}
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let pointer=null;
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e)});
function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=43;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;knob.style.left=(39+dx)+'px';knob.style.top=(39+dy)+'px'}
function release(){pointer=null;joy={x:0,y:0};knob.style.left='37px';knob.style.top='37px'}
stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
document.querySelector('#jump').onclick=()=>{if(player.position.y<.1)velY=8};
document.querySelector('#cam').onclick=()=>camTurn+=Math.PI/4;
document.querySelector('#ride').onclick=()=>{if(!movingCar&&player.position.distanceTo(car.position)<5){movingCar=true;player.visible=false;say('ركبت السيارة! استخدم العصا للقيادة')}else if(movingCar){movingCar=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(3,0,0));say('نزلت من السيارة')}else say('اقترب من السيارة الحمراء أولاً')};
document.querySelector('#map').onclick=()=>say(collected<12?`باقي لك ${12-collected} بلورة زرقاء`:'اتجه إلى المخيم عند علامة النار');
let last=performance.now();
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;
crystals.forEach(c=>{c.rotation.y+=dt*1.5;c.position.y=1.2+Math.sin(now*.002+c.position.x)*.2});
let target=movingCar?car:player;let speed=movingCar?15:8;let forward=new THREE.Vector3(joy.x,0,joy.y);forward.applyAxisAngle(new THREE.Vector3(0,1,0),camTurn);if(forward.length()>1)forward.normalize();
if(forward.length()>.05){target.position.x+=forward.x*speed*dt;target.position.z+=forward.z*speed*dt;target.rotation.y=Math.atan2(forward.x,forward.z)}
target.position.x=THREE.MathUtils.clamp(target.position.x,-88,88);target.position.z=THREE.MathUtils.clamp(target.position.z,-88,88);
if(!movingCar){velY-=20*dt;player.position.y=Math.max(0,player.position.y+velY*dt);if(player.position.y===0)velY=0;
for(let i=crystals.length-1;i>=0;i--)if(player.position.distanceTo(crystals[i].position)<2.2){scene.remove(crystals[i]);crystals.splice(i,1);collected++;document.querySelector('#count').textContent=collected;if(collected===12){document.querySelector('#mission').textContent='🏕️ المهمة الأخيرة: زر المخيم عند النار!';say('جمعت كل البلورات! اذهب إلى المخيم')} }}
if(collected===12&&player.position.distanceTo(camp.position)<5) {document.querySelector('#mission').textContent='🏆 أنهيت مغامرة الجزيرة!';}
let focus=target.position;let offset=new THREE.Vector3(Math.sin(camTurn)*10,8,Math.cos(camTurn)*10);let desired=focus.clone().add(offset);camera.position.lerp(desired,.09);camera.lookAt(focus.x,focus.y+1,focus.z);
renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
say('أهلاً بك! اجمع البلورات واستكشف الجزيرة');
</script>
</body></html>
